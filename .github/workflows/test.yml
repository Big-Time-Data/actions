name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -W error::ResourceWarning -m unittest discover -s tests -t . -v
        env:
          PYTHONPATH: src

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.7 -color

  # Run the actions from this checkout on each runner OS.
  self-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: notes
        uses: ./release-notes
        with:
          tag: v99.0.0
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          product: "Big-Time-Data/actions, shared GitHub Actions for BTD repos"
          header: "## actions {tag}"

      - name: Check notes
        env:
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
          SLACK: ${{ steps.notes.outputs.slack_summary }}
          SOURCE: ${{ steps.notes.outputs.source }}
        run: |
          set -euo pipefail
          test -s "$NOTES_FILE"
          grep -q '^## actions v99.0.0' "$NOTES_FILE"
          test -n "$SLACK"
          echo "source=$SOURCE"

      - uses: ./slack-notify
        with:
          title: "actions self-test"
          message: ${{ steps.notes.outputs.slack_summary }}
          color: ${{ job.status }}
          dry_run: true

  # mcp-query against Postgres, with the starter tree of mcpq init and one
  # table for the catalog source. MCPQ_CONN holds the file content, as a
  # secret does.
  mcp-query:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [latest, v0]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mcpq
          POSTGRES_PASSWORD: mcpq
          POSTGRES_DB: shop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mcpq -d shop"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      PGHOST: localhost
      PGUSER: mcpq
      PGPASSWORD: mcpq
      PGDATABASE: shop
      MCPQ_CONN: |
        type: postgres
        host: localhost
        port: 5432
        user: mcpq
        password: mcpq
        database: shop
        sslmode: disable
    steps:
      - uses: actions/checkout@v5
      - name: Install mcpq for init
        env:
          PYTHONPATH: src
          INPUT_VERSION: ${{ matrix.version }}
          INPUT_GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m btd_actions.mcp_query install
      - name: Make the starter tree and the context schema
        run: |
          set -euo pipefail
          mkdir shop && cd shop && git init -q
          mcpq init --yes --no-ci --warehouse postgres --schema mcpq --org "Test Shop"
          perl -0pi -e 's/  # catalog_scope:\n  #   databases: \[ANALYTICS\]\n  #   include_schemas: \[MARTS\]/  catalog_scope:\n    databases: [shop]\n    include_schemas: [shop]/; s/  # catalog:\n  #   profile: false/  catalog:\n    profile: false/' mcpq/mcpq.yaml
          grep -q '^  catalog:' mcpq/mcpq.yaml
          psql -v ON_ERROR_STOP=1 -qc "CREATE SCHEMA shop; CREATE TABLE shop.orders (id int PRIMARY KEY, amount numeric); INSERT INTO shop.orders VALUES (1, 10);"
          for f in 01-schema.sql 03-log-procedure.sql; do
            psql -v ON_ERROR_STOP=1 -q -f "mcpq/sql/$f"
          done
      - name: Preview (no publish)
        id: preview
        uses: ./mcp-query
        with:
          version: ${{ matrix.version }}
          working_directory: shop
          source: curated, catalog
          publish: false
      - name: Check that preview did not publish
        run: test "$(psql -tAc 'SELECT count(*) FROM mcpq.tables')" -eq 0
      - id: publish
        uses: ./mcp-query
        with:
          version: ${{ matrix.version }}
          working_directory: shop
          source: curated, catalog
      - name: Check the published tables
        env:
          ARTIFACT: ${{ steps.publish.outputs.artifact }}
          VERSION: ${{ steps.publish.outputs.version }}
        run: |
          set -euo pipefail
          echo "version=$VERSION artifact=$ARTIFACT"
          test -n "$ARTIFACT"
          test "$(psql -tAc 'SELECT count(*) FROM mcpq.tables')" -ge 1

  mcp-query-no-conn:
    # The action stops before it builds when MCPQ_CONN is not set.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: run
        uses: ./mcp-query
        continue-on-error: true
      - name: Check that the action failed
        env:
          OUTCOME: ${{ steps.run.outcome }}
        run: test "$OUTCOME" = failure

  pr-enhance:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ./pr-enhance
        with:
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          product: "Big-Time-Data/actions, shared GitHub Actions for BTD repos"
          fail_on_error: true

  # The reusable workflow uses the published @v1 action.
  reusable:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/pr-enhance.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      product: "Big-Time-Data/actions, shared GitHub Actions for BTD repos"
      dry_run: true
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
